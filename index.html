<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>RIPPLE — Life &amp; Markets</title>

  <!-- CSS stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Three.js library required by the game -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Our game JavaScript -->
  <script src="script.js" defer></script>
</head>

<body>
  <div id="gl"></div>

  <div id="top" class="glass">
    <div class="logo">RIPPLE<small>Life &amp; Markets</small></div>

    <div class="pill">
      💲
      <div>
        <small>Cash</small>
        <b id="hCash"></b>
      </div>
    </div>

    <div class="pill">
      📈
      <div>
        <small>Investments</small>
        <b id="hInv"></b>
      </div>
    </div>

    <div class="pill">
      💼
      <div>
        <small>Job</small>
        <b id="hJob"></b>
      </div>
    </div>

    <div class="pill">
      📅
      <div>
        <small id="hYr"></small>
        <b id="hAge"></b>
      </div>
    </div>

    <div class="vit">
      <div>
        ❤️ Health
        <i><u id="vH" style="background:#10b981"></u></i>
      </div>
      <div>
        ⚡ Energy
        <i><u id="vE" style="background:#38bdf8"></u></i>
      </div>
      <div>
        😊 Happiness
        <i><u id="vP" style="background:#f59e0b"></u></i>
      </div>
    </div>

    <button class="ib" id="gear" aria-label="Settings">⚙</button>
  </div>

  <nav id="side" class="glass">
    <button data-p="market" data-i="📊">📊 Stock Market</button>
    <button data-p="portfolio" data-i="👛">👛 Portfolio</button>
    <button data-p="journal" data-i="📖">📖 Journal</button>
    <button data-p="messages" data-i="💬">
      💬 Messages
      <b id="badge"></b>
    </button>
    <button data-p="settings" data-i="⚙">⚙️ Settings</button>
  </nav>

  <div id="mm">
    <canvas id="mmc" width="340" height="340"></canvas>
    <b>N</b>
  </div>

  <div id="dock" class="glass">
    <button data-p="market">📊<span>Stock Market</span></button>
    <button data-p="portfolio">👛<span>Portfolio</span></button>
    <button data-a="work">💼<span>Work</span></button>
    <button data-a="rest">🛏️<span>Rest</span></button>
    <button data-a="travel">✈️<span>Travel</span></button>
  </div>

  <button id="go"></button>
  <div id="ban"></div>
  <div id="tip"></div>
  <div id="toast"></div>

  <div id="pnl" class="glass"></div>

  <div id="dlg">
    <div id="dc" class="glass"></div>
  </div>
</body>
</html>
